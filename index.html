<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mars</title>
    <link rel="icon" type="image/svg+xml" href="https://res.cloudinary.com/dbwqwgbtx/image/upload/v1780675768/Mars_favicon_cqeb0a.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { red: '#c20000', dark: '#000000' } },
                    fontFamily: { 
                        poppins: ['Poppins', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif']
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(194,0,0,0.5)' },
                            '100%': { boxShadow: '0 0 20px rgba(194,0,0,0.8)' }
                        },
                        dotPulse: {
                            '0%, 20%': { opacity: 0.2, transform: 'scale(0.8)' },
                            '50%': { opacity: 1, transform: 'scale(1.2)' }
                        }
                    },
                    animation: { glow: 'glow 1.5s ease-in-out infinite alternate', dotPulse: 'dotPulse 1.4s ease-in-out infinite' }
                }
            }
        }
    </script>

    <style>
        .dot { display: inline-block; animation: dotPulse 1.4s ease-in-out infinite; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        
        #loader-overlay { transition: opacity 0.6s ease-out, visibility 0.6s ease-out; background: #000000; }
        #start-btn { opacity: 0; visibility: hidden; cursor: default; transition: opacity 0.3s ease; }
        #start-btn.ready { opacity: 1; visibility: visible; cursor: pointer; }
        #start-btn.ready:hover { animation: glow 1s ease-in-out infinite alternate; transform: scale(1.05); }

        body {
            min-height: 100vh;
            background: #b80101;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            zoom: 90%; 
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0c0c0c;
            border-radius: 10px;
            border: 1px solid #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #c20000, #8b0000);
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(194, 0, 0, 0.3);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #e00000, #c20000);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(194, 0, 0, 0.5);
        }

        ::-webkit-scrollbar-thumb:active {
            background: linear-gradient(135deg, #ff1a1a, #e00000);
        }

        ::-webkit-scrollbar-corner {
            background: #0c0c0c;
            border: 1px solid #1a1a1a;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #c20000 #0c0c0c;
        }

        .container {
            scrollbar-width: thin;
            scrollbar-color: #c20000 #0c0c0c;
        }
        
        #mars-ui { opacity: 0; visibility: hidden; transition: opacity 0.5s ease; }
        #mars-ui.visible { opacity: 1; visibility: visible; }

        .robot-face {
            width: 100%;
            max-width: 380px;
            height: 300px;
            background: #000000;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 55px;
            position: relative;
            margin: 0 auto;
            z-index: 2;
            overflow: hidden;
        }

        .eye-wrapper {
            position: relative;
            width: 85px;
            height: 115px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .eye {
            width: 68px;
            height: 100px;
            background: #ffffff;
            border-radius: 50%;
            position: relative;
            transition: transform 0.08s linear;
            z-index: 4;
        }

        @keyframes naturalBlink {
            0% { transform: scaleY(1) scaleX(1); }
            15% { transform: scaleY(0.9) scaleX(1.02); }
            35% { transform: scaleY(0.05) scaleX(0.98); }
            65% { transform: scaleY(0.05) scaleX(0.98); }
            85% { transform: scaleY(0.9) scaleX(1.02); }
            100% { transform: scaleY(1) scaleX(1); }
        }
        @keyframes tvShutdown {
            0% { transform: scaleY(1) scaleX(1); opacity: 1; }
            20% { transform: scaleY(0.05) scaleX(1); opacity: 1; }
            60% { transform: scaleY(0.02) scaleX(0.3); opacity: 0.5; }
            100% { transform: scaleY(0) scaleX(0); opacity: 0; }
        }
        @keyframes tvTurnOn {
            0% { transform: scaleY(0) scaleX(0); opacity: 0; }
            40% { transform: scaleY(0.02) scaleX(0.3); opacity: 0.5; }
            80% { transform: scaleY(0.05) scaleX(1); opacity: 1; }
            100% { transform: scaleY(1) scaleX(1); opacity: 1; }
        }
        @keyframes shyEyes {
            0% { transform: translate(0px, 0px); }
            100% { transform: translate(8px, 3px); }
        }
        @keyframes unshyEyes {
            0% { transform: translate(8px, 3px); }
            100% { transform: translate(0px, 0px); }
        }
        @keyframes listeningWave {
            0% { transform: scaleY(0.15) scaleX(1); background: #ffffff; box-shadow: 0 0 12px #cfcfce; }
            100% { transform: scaleY(0.22) scaleX(1.05); background: #fafaf9; box-shadow: 0 0 18px #ffffff; }
        }
        @keyframes processingPulse {
            0% { transform: scale(0.95); background: #fcfbfb; box-shadow: 0 0 10px #ffffff; }
            100% { transform: scale(1.05); background: #f5bebe; box-shadow: 0 0 22px #eea2a2; }
        }

        .eye.blinking { animation: naturalBlink 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .eye.tv-shutdown { animation: tvShutdown 0.6s ease-out forwards; }
        .eye.tv-turnon { animation: tvTurnOn 0.5s ease-out forwards; }
        .eye.shy-left, .eye.shy-right { animation: shyEyes 0.3s ease-out forwards; }
        .eye.unshy-left, .eye.unshy-right { animation: unshyEyes 0.3s ease-out forwards; }
        .eye.hidden { opacity: 0; transform: scale(0) !important; }
        
        .eye.state-listening { animation: listeningWave 0.25s ease-in-out infinite alternate !important; border-radius: 10px; }
        .eye.state-processing { animation: processingPulse 0.2s ease-in-out infinite alternate !important; }

        .cheek {
            position: absolute;
            width: 46px;
            height: 46px;
            background: #ff69b4;
            border-radius: 50%;
            bottom: 48px;
            opacity: 0;
            transition: opacity 0.3s ease;
            filter: blur(2px);
            z-index: 3;
        }
        .cheek.left-cheek { left: 76px; }
        .cheek.right-cheek { right: 76px; }
        .cheek.visible { opacity: 0.85; }

        .crt-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 999; }
        .scanlines {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px);
        }
        @keyframes flicker {
            0% { opacity: 0.95; } 5% { opacity: 0.92; } 10% { opacity: 0.96; }
            15% { opacity: 0.93; } 20% { opacity: 0.97; } 100% { opacity: 0.95; }
        }
        .noise {
            position: absolute; inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.04"/></svg>');
            background-repeat: repeat; background-size: 200px 150px; opacity: 0.3;
            mix-blend-mode: overlay; animation: flicker 0.15s infinite;
        }
        .chromatic {
            position: absolute; inset: 0;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 30px rgba(255, 0, 255, 0.05);
        }
        .robot-face::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at center, transparent 70%, rgba(0,0,0,0.4) 100%);
            z-index: 1000;
        }
        .phosphor {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 20% 40%, rgba(255,0,0,0.08) 0%, transparent 50%);
            mix-blend-mode: screen;
        }
    </style>
</head>
<body class="bg-red font-poppins overflow-y-auto">
    <div id="desktop-block" class="hidden fixed inset-0 z-[10000] flex-col items-center justify-center bg-black text-center p-6 select-none">
        <div class="max-w-md space-y-6">
            <div class="flex justify-center">
                <div class="w-16 h-16 bg-brand-red/10 rounded-2xl flex items-center justify-center border border-brand-red/20">
                    <i data-lucide="smartphone" class="w-8 h-8 text-brand-red"></i>
                </div>
            </div>
            
            <div class="space-y-2">
                <h2 class="text-2xl font-bold tracking-tight text-white font-outfit">Ops... Somente smartphones</h2>
                <p class="text-sm text-zinc-400 font-light leading-relaxed">
                    Este aplicativo foi feito exclusivamente para o uso em dispositivos móveis. <br>
                    <span class="text-white font-medium">Escaneie o qr code e abra o link com seu celular.</span>
                </p>
            </div>

            <div class="flex flex-col items-center justify-center bg-zinc-900/50 p-6 rounded-3xl border border-zinc-850 backdrop-blur-sm">
                <div id="qrcode-container" class="bg-white p-4 rounded-2xl shadow-xl border border-white/10">
                    </div>
                <p class="text-xs text-zinc-500 font-mono mt-4">Aponte a câmera para escanear</p>
            </div>
        </div>
    </div>

    <div id="loader-overlay" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black">
        <div class="text-center space-y-8 p-8">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 bg-brand-red/20 rounded-2xl flex items-center justify-center border border-brand-red/30 animate-pulse">
                    <i data-lucide="bot" class="w-10 h-10 text-brand-red"></i>
                </div>
            </div>
            <div class="space-y-3">
                <h2 class="text-2xl font-semibold text-white tracking-wide">Initializing Mars</h2>
                <div class="flex justify-center gap-1 text-2xl font-bold text-brand-red">
                    <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
                </div>
                <p id="loading-status" class="text-xs text-gray-400 mt-4 font-mono">Loading...</p>
            </div>

                </button>

    </div>

    <div id="mars-ui">
        <div class="container text-center w-full max-w-md px-5 py-6 mx-auto min-h-screen flex items-center justify-center">
            <div class="w-full">
                <h1 class="text-5xl font-black text-white tracking-tight">Mars</h1>
                <p class="text-gray-400 text-sm mt-1 mb-6"></p>

                <div class="bg-[#c20000] rounded-[44px] p-4 mb-6 shadow-2xl border border-red-500/20">
                    <div class="robot-face" id="marsFace">
                        <div class="cheek left-cheek" id="leftCheek"></div>
                        <div class="cheek right-cheek" id="rightCheek"></div>
                        
                        <div class="eye-wrapper">
                            <div class="eye left-eye hidden" id="leftEye"></div>
                        </div>
                        <div class="eye-wrapper">
                            <div class="eye right-eye hidden" id="rightEye"></div>
                        </div>

                        <div class="crt-overlay">
                            <div class="scanlines"></div>
                            <div class="noise"></div>
                            <div class="chromatic"></div>
                            <div class="phosphor"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-zinc-900/60 backdrop-blur rounded-3xl p-5 mb-6 border border-white/5">
                    <div id="status-text" class="text-xl font-bold text-white mb-2">Desconectado</div>
                    <div id="transcript-text" class="text-sm text-zinc-400 italic min-h-[44px] flex items-center justify-center px-4">Aguardando inicialização do painel...</div>
                </div>

                <div id="status-bar" class="w-full bg-zinc-800 text-zinc-400 font-bold py-4 rounded-full text-sm shadow-lg tracking-wide uppercase transition-all duration-300 border border-white/5">
                    Microphone Standby
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== ESTRUTURA DE COMANDOS DE PRODUÇÃO ==========
        const MARS_COMMANDS = {
            whiteboard: {
                keywords: ['open board', 'abrir bord', 'open bord', 'board', 'abrir board'],
                url: 'https://dididoingles.github.io/whiteboard-2.0/',
                message: 'Redirecionando para o Whiteboard...'
            },
        
            languagelab: {
                keywords: ['open lab', 'lab', 'language lab'],
                url: 'https://sites.google.com/view/languagelabbr/in%C3%ADcio',
                message: 'Redirecionando para o Lab...'
            }
            
        }; 

        // ========== BANCO DE ÁUDIOS NATIVOS DO MARS ==========
        const blinkSound1 = new Audio('https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780595584/blink_FNZ3zVv_utzu5n.mp3');
        const blinkSound2 = new Audio('https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780595584/blink-sound-effect_online-video-cutter.com_zgrtzb.mp3');
        const wakeSound = new Audio('https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780093489/soundshelfstudio-ui-app-notification-524745_dg4hrb.mp3');
        const sleepSound = new Audio('https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780093488/47313572-ui-sounds-pack-2-sound-8-358892_swimko.mp3');
        const blushSound = new Audio('https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780071235/zapsplat_multimedia_beep_high_tech_ui_014_87535_zws6w3.mp3');
        const greetingSound = new Audio('https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780677575/Mars_UK_ENG_z5dmlq.mp3');

        blinkSound1.volume = 0.1; blinkSound2.volume = 0.1;
        wakeSound.volume = 0.4; sleepSound.volume = 0.4; blushSound.volume = 0.35;

        function playSound(audioObj) {
            if (!audioObj) return;
            audioObj.currentTime = 0;
            audioObj.play().catch(e => console.log("Audio block:", e.message));
        }

        // ========== MOTOR DE RECONHECIMENTO DE VOZ CONTÍNUO ==========
        let recognition = null;
        let isListening = false;
        let shouldListen = false; // Controla se o microfone deve se auto-reiniciar

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusText.innerText = "API Indisponível";
                transcriptText.innerText = "Este navegador não suporta a Web Speech API.";
                return;
            }
            recognition = new SpeechRecognition();
            recognition.continuous = true; // Mantém a escuta ativa continuamente em background
            recognition.interimResults = true; // Captura em tempo real para respostas rápidas
            recognition.lang = 'en-US'; 

            recognition.onstart = () => {
                isListening = true;
                updateStatusBar('active');
            };

            recognition.onresult = (event) => {
                let textChunk = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        textChunk = event.results[i][0].transcript;
                        tratarFluxoVoz(textChunk);
                    } else {
                        // Enquanto fala, exibe na tela o feedback em tempo real
                        const temporario = event.results[i][0].transcript.toLowerCase();
                        transcriptText.innerText = `... ${temporario}`;
                        if ((temporario.includes('mars') || temporario.includes('marte')) && !isBlushing) {
                            changeMarsMood('listening');
                        }
                    }
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    console.warn("Speech recognition error:", event.error);
                }
            };

            recognition.onend = () => {
                isListening = false;
                // Mecanismo crucial de persistência mobile: se o sistema fechar o mic por silêncio, nós reabrimos imediatamente
                if (shouldListen) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log("Erro na persistência do loop:", e);
                    }
                } else {
                    updateStatusBar('standby');
                }
            };
        }

        function startAudioEngine() {
            if (!recognition) return;
            shouldListen = true;
            if (!isListening) {
                try {
                    recognition.start();
                } catch(e) {
                    console.error(e);
                }
            }
        }

        function updateStatusBar(state) {
            const bar = document.getElementById('status-bar');
            if(!bar) return;
            if(state === 'active') {
                bar.innerText = "Listening for 'Mars'...";
                bar.className = "w-full bg-red-600/20 text-red-500 font-black py-4 rounded-full text-sm shadow-lg tracking-wide uppercase border border-red-500/30 animate-pulse";
            } else if (state === 'processing') {
                bar.innerText = "Executing Command...";
                bar.className = "w-full bg-white text-black font-black py-4 rounded-full text-sm shadow-lg tracking-wide uppercase border border-white";
            } else {
                bar.innerText = "Microphone Standby";
                bar.className = "w-full bg-zinc-800 text-zinc-400 font-bold py-4 rounded-full text-sm shadow-lg tracking-wide uppercase border border-white/5";
            }
        }

        function tratarFluxoVoz(textoCapturado) {
            const textoLimpo = textoCapturado.trim().toLowerCase();
            if(textoLimpo.length < 2) return;

            transcriptText.innerText = `Captured: "${textoCapturado}"`;

            // Verifica se o gatilho principal foi invocado na sentença finalizada
            const gatilhoMars = textoLimpo.includes('mars') || textoLimpo.includes('marte') || textoLimpo.includes('mas');
            const gratidao = textoLimpo.includes('thank you') || textoLimpo.includes('obrigado') || textoLimpo.includes('obrigada') || textoLimpo.includes('valeu') || textoLimpo.includes('thanks');

            if (gratidao) {
                activateBlushEffect();
                return;
            }

            if (gatilhoMars) {
                changeMarsMood('processing');
                updateStatusBar('processing');
                
                setTimeout(() => {
                    filtrarComandoDicionario(textoLimpo);
                }, 400);
            } else {
                // Se capturou fala comum sem gatilho, volta a expressão padrão do Mars
                if (!isBlushing) {
                changeMarsMood('wake');
                updateStatusBar('active');
            }
        }
    }

        // ========== ESTADOS DO MOTOR VISUAL ==========
        let leftEyeRect, rightEyeRect;
        let eyesOpen = false;
        let isBlinking = false;
        let isAnimating = false;
        let isBlushing = false;
        let isSleeping = true;
        let blinkSequenceTimer = null;
        let isBlinkSequenceRunning = false;
        let blushTimeout = null;
        let lastMouseX = 0, lastMouseY = 0;

        const statusText = document.getElementById('status-text');
        const transcriptText = document.getElementById('transcript-text');
        const leftEye = document.getElementById('leftEye');
        const rightEye = document.getElementById('rightEye');
        const leftCheek = document.getElementById('leftCheek');
        const rightCheek = document.getElementById('rightCheek');

        function updateEyeRects() {
            leftEyeRect = leftEye.getBoundingClientRect();
            rightEyeRect = rightEye.getBoundingClientRect();
        }

        function moveEyes(event) {
            if (!eyesOpen || isBlinking || isAnimating || isBlushing || isSleeping) return;
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
            moveSingleEye(lastMouseX, lastMouseY, leftEyeRect, leftEye);
            moveSingleEye(lastMouseX, lastMouseY, rightEyeRect, rightEye);
        }

        function moveSingleEye(mouseX, mouseY, eyeRect, eyeElement) {
            if(!eyeRect || eyeRect.width === 0) return;
            const eyeCenterX = eyeRect.left + eyeRect.width / 2;
            const eyeCenterY = eyeRect.top + eyeRect.height / 2;
            const deltaX = mouseX - eyeCenterX, deltaY = mouseY - eyeCenterY;
            const angle = Math.atan2(deltaY, deltaX);
            const maxMove = 22;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            let moveDistance = Math.min(maxMove, distance / 15);
            if (distance < 100) moveDistance = maxMove;
            const moveX = Math.cos(angle) * moveDistance;
            const moveY = Math.sin(angle) * moveDistance;
            eyeElement.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }

        function changeMarsMood(mood) {
            leftEye.classList.remove('state-listening', 'state-processing', 'hidden');
            rightEye.classList.remove('state-listening', 'state-processing', 'hidden');

            if (mood === 'sleep') {
                isSleeping = true; eyesOpen = false;
                statusText.innerText = "Inativo";
                leftEye.classList.add('hidden');
                rightEye.classList.add('hidden');
            } 
            else if (mood === 'wake') {
                isSleeping = false; eyesOpen = true; isBlushing = false;
                statusText.innerText = "Online";
                leftEye.style.transform = '';
                rightEye.style.transform = '';
                if (lastMouseX) moveSingleEye(lastMouseX, lastMouseY, leftEyeRect, leftEye);
                if (lastMouseX) moveSingleEye(lastMouseX, lastMouseY, rightEyeRect, rightEye);
            } 
            else if (mood === 'listening') {
                statusText.innerText = "Hearing Gatilho...";
                leftEye.classList.add('state-listening');
                rightEye.classList.add('state-listening');
            } 
            else if (mood === 'processing') {
                statusText.innerText = "Processing...";
                leftEye.classList.add('state-processing');
                rightEye.classList.add('state-processing');
            }
        }

        let blinkCounter = 0;
        function performBlink() {
            return new Promise((resolve) => {
                if (isBlinking || !eyesOpen || isBlushing || isSleeping) {
                    resolve();
                    return;
                }
                blinkCounter++;
                playSound(blinkCounter % 2 === 1 ? blinkSound1 : blinkSound2);
                
                isBlinking = true;
                leftEye.classList.add('blinking');
                rightEye.classList.add('blinking');
                
                setTimeout(() => {
                    leftEye.classList.remove('blinking');
                    rightEye.classList.remove('blinking');
                    isBlinking = false;
                    if (lastMouseX && eyesOpen && !isBlushing && !isSleeping) {
                        moveSingleEye(lastMouseX, lastMouseY, leftEyeRect, leftEye);
                        moveSingleEye(lastMouseX, lastMouseY, rightEyeRect, rightEye);
                    }
                    resolve();
                }, 200);
            });
        }

        function startBlinkingLoop() {
            if (blinkSequenceTimer) clearTimeout(blinkSequenceTimer);
            const runCycle = async () => {
                if (!eyesOpen || isBlushing || isSleeping) {
                    blinkSequenceTimer = setTimeout(runCycle, 1000);
                    return;
                }
                if (!isBlinkSequenceRunning) {
                    isBlinkSequenceRunning = true;
                    await performBlink();
                    await performBlink();
                    await new Promise(r => setTimeout(r, 2500));
                    await performBlink();
                    isBlinkSequenceRunning = false;
                }
                blinkSequenceTimer = setTimeout(runCycle, 5000);
            };
            runCycle();
        }

        function wakeMarsFace() {
            if (blushTimeout) clearTimeout(blushTimeout);
            playSound(wakeSound);
            isAnimating = true;
            isSleeping = false;
            
            leftEye.classList.remove('hidden', 'tv-shutdown');
            rightEye.classList.remove('hidden', 'tv-shutdown');
            leftEye.classList.add('tv-turnon');
            rightEye.classList.add('tv-turnon');
            
            setTimeout(() => {
                leftEye.classList.remove('tv-turnon');
                rightEye.classList.remove('tv-turnon');
                isAnimating = false;
                eyesOpen = true;
                changeMarsMood('wake');
                updateEyeRects();
                startBlinkingLoop();
            }, 500);
        }

        function activateBlushEffect() {
            if (isSleeping || isAnimating || isBlushing) return;
            if (blinkSequenceTimer) clearTimeout(blinkSequenceTimer);

            leftEye.classList.remove('state-listening', 'state-processing');
            rightEye.classList.remove('state-listening', 'state-processing');
            
            playSound(blushSound);
            isBlushing = true;
            isAnimating = true;
            
            leftEye.style.transform = '';
            rightEye.style.transform = '';
            leftEye.classList.add('shy-left');
            rightEye.classList.add('shy-right');
            
            setTimeout(() => {
                leftCheek.classList.add('visible');
                rightCheek.classList.add('visible');
                isAnimating = false;
                
                blushTimeout = setTimeout(() => {
                    leftCheek.classList.remove('visible');
                    rightCheek.classList.remove('visible');
                    leftEye.classList.remove('shy-left');
                    rightEye.classList.remove('shy-right');
                    leftEye.classList.add('unshy-left');
                    rightEye.classList.add('unshy-right');
                    
                    setTimeout(() => {
                        leftEye.classList.remove('unshy-left');
                        rightEye.classList.remove('unshy-right');
                        isBlushing = false;
                        changeMarsMood('wake');
                        updateStatusBar('active');
                        startBlinkingLoop();
                    }, 300);
                }, 2000);
            }, 300);
        }

        function filtrarComandoDicionario(textoTratado) {
            const textoSemPontuacao = textoTratado.replace(/[,.]/g, '').trim();

            for (const key in MARS_COMMANDS) {
                const cmd = MARS_COMMANDS[key];
                const match = cmd.keywords.some(k => textoSemPontuacao.includes(k));
                
                if (match) {
                    if (navigator.vibrate) navigator.vibrate(60);
                    playSound(blushSound);
                    
                    transcriptText.innerText = cmd.message;
                    
                    if (cmd.url !== '#') {
                        window.open(cmd.url, '_blank');
                    }
                    
                    // Retorna ao estado de escuta contínua padrão após abrir a URL
                    setTimeout(() => {
                        changeMarsMood('wake');
                        updateStatusBar('active');
                    }, 1000);
                    return;
                }
            }
            
            // Se ouviu "Mars", mas não achou o comando secundário no dicionário
            changeMarsMood('wake');
            updateStatusBar('active');
        }

        // ========== RASTREAMENTO E LISTENERS DOS EVENTOS ==========
        window.addEventListener('mousemove', moveEyes);
        
        window.addEventListener('resize', () => {
            setTimeout(() => {
                updateEyeRects();
                if (lastMouseX && eyesOpen) {
                    moveSingleEye(lastMouseX, lastMouseY, leftEyeRect, leftEye);
                    moveSingleEye(lastMouseX, lastMouseY, rightEyeRect, rightEye);
                }
            }, 150);
        });

        function updateLoaderStatus(msg) {
            const el = document.getElementById('loading-status');
            if (el) el.textContent = msg;
        }
        
        setTimeout(() => {
            updateLoaderStatus('Systems ready.');
            document.getElementById('start-btn').classList.add('ready');
        }, 1200);
        
        document.getElementById('start-btn').addEventListener('click', () => {
    if (!document.getElementById('start-btn').classList.contains('ready')) return;
    
    document.getElementById('loader-overlay').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('loader-overlay').style.display = 'none';
        document.getElementById('mars-ui').classList.add('visible');
        
        wakeMarsFace();
        initSpeechRecognition();
        startAudioEngine(); 
        
        transcriptText.innerText = "Say 'Mars' followed by a command...";
        
        // Dispara a voz do Cloudinary exatamente 1 segundo após o painel aparecer
        setTimeout(() => {
            marsSpeakWithAudio(greetingSound);
        }, 1000);
        
    }, 600);
});

        if (typeof lucide !== 'undefined') lucide.createIcons();
        // Função segura para o Mars falar

// Função para reproduzir o áudio físico do Cloudinary com segurança controlando o microfone
// VERSÃO corrigida: Destrói e recria o microfone de forma limpa após o término do áudio
function marsSpeakWithAudio(audioObj) {
    if (!audioObj) return;

    // 1. Diz ao sistema para ignorar leituras e para o reconhecimento com segurança
    shouldListen = false;
    if (recognition) {
        try {
            recognition.stop();
        } catch(e) {
            console.log("Aviso ao parar mic:", e);
        }
    }

    // 2. Quando o áudio do Cloudinary terminar, reconecta o hardware do zero
    audioObj.onended = () => {
        shouldListen = true;
        resetSpeechRecognition();
    };

    // 3. Reseta o áudio para o início e toca
    audioObj.currentTime = 0;
    audioObj.play().catch(e => {
        console.warn("Bloqueio de reprodução de áudio:", e.message);
        // Fallback de segurança se a rede falhar
        shouldListen = true;
        resetSpeechRecognition();
    });
}
// Função auxiliar para redefinir a ponte de áudio com o navegador do zero
function resetSpeechRecognition() {
    // Se já houver uma instância rodando, removemos os listeners antigos para evitar vazamento de memória
    if (recognition) {
        recognition.onstart = null;
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
    }

    // Reinicializa o motor exatamente como no carregamento da página
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    // Reatribui os comportamentos originais do seu painel
    recognition.onstart = () => {
        isListening = true;
        updateStatusBar('active');
    };

    recognition.onresult = (event) => {
        let textChunk = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                textChunk = event.results[i][0].transcript;
                tratarFluxoVoz(textChunk);
            } else {
                const temporario = event.results[i][0].transcript.toLowerCase();
                transcriptText.innerText = `... ${temporario}`;
                if ((temporario.includes('mars') || temporario.includes('marte')) && !isBlushing) {
                    changeMarsMood('listening');
                }
            }
        }
    };

    recognition.onerror = (event) => {
        if (event.error !== 'no-speech') {
            console.warn("Speech recognition error:", event.error);
        }
    };

    recognition.onend = () => {
        isListening = false;
        if (shouldListen) {
            try { recognition.start(); } catch (e) { console.log("Erro na persistência:", e); }
        } else {
            updateStatusBar('standby');
        }
    };

    // Força o início da captação com a nova ponte limpa
    try {
        recognition.start();
    } catch(e) {
        console.error("Erro ao iniciar nova instância do microfone:", e);
    }
}
// ========== SISTEMA DE VERIFICAÇÃO E BLOQUEIO DESKTOP ==========
function verificarDispositivo() {
    // Detecta celulares comuns (iOS, Android, etc) e telas menores que 1024px
    const IsMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const IsSmallScreen = window.innerWidth < 1024;

    if (!IsMobile && !IsSmallScreen) {
        // Se NÃO for mobile e NÃO for tela pequena, ativa o bloqueio
        const blockOverlay = document.getElementById('desktop-block');
        const qrContainer = document.getElementById('qrcode-container');
        
        if (blockOverlay && qrContainer) {
            // Exibe a tela de bloqueio mudando a classe do Tailwind
            blockOverlay.classList.remove('hidden');
            blockOverlay.classList.add('flex');
            
            // Pega a URL atual do seu app para gerar o QR Code dinamicamente
            const currentUrl = encodeURIComponent(window.location.href);
            
            // Injeta a imagem do QR Code usando a API do qrserver (usando seu vermelho #c20000)
            qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${currentUrl}&color=c20000" alt="QR Code" class="w-[180px] h-[180px]" />`;
            
            // Trava o carregamento dos outros sistemas do Mars
            if (recognition) {
                shouldListen = false;
                try { recognition.stop(); } catch(e) {}
            }
            throw new Error("Aplicativo suspenso: Acesso restrito a dispositivos móveis.");
        }
    }
}

// Executa a checagem imediatamente assim que o script é lido
verificarDispositivo();
